<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <rect width="560" height="220" fill="#FAF6F0"/>
  <text x="20" y="155" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="900" font-size="150" fill="#0F2A2D" letter-spacing="-7">stan</text>
  <!-- Custom dd ligature: two d-bowls sharing a central stem (architectural / arch-and-column) -->
  <g transform="translate(290, 32)">
    <!-- Left bowl (mirrored d-bowl, opens right) -->
    <path d="M 105,0 L 105,128 L 60,128 Q 0,128 0,64 Q 0,0 60,0 Z" fill="#FF6B2C"/>
    <!-- Inner cut for left bowl -->
    <path d="M 75,30 L 75,98 L 60,98 Q 28,98 28,64 Q 28,30 60,30 Z" fill="#FAF6F0"/>
    <!-- Central shared stem -->
    <rect x="105" y="0" width="32" height="128" fill="#FF6B2C"/>
    <!-- Right bowl (normal d-bowl, opens left) -->
    <path d="M 137,0 L 137,128 L 182,128 Q 242,128 242,64 Q 242,0 182,0 Z" fill="#FF6B2C"/>
    <!-- Inner cut for right bowl -->
    <path d="M 167,30 L 167,98 L 182,98 Q 214,98 214,64 Q 214,30 182,30 Z" fill="#FAF6F0"/>
  </g>
  <text x="20" y="195" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="18" fill="#0F2A2D" letter-spacing="2">F — CUSTOM dd LIGATURE</text>
</svg>
